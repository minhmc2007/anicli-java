name: Bump version

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version, for example 0.0.2. The release and PR use this value.'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bump-version-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ inputs.version }}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $version"
            exit 1
          fi
          if gh release view "$version" >/dev/null 2>&1; then
            echo "Release $version already exists"
            exit 1
          fi

      - name: Update Version.java
        run: |
          sed -i -E 's/(NAME[[:space:]]*=[[:space:]]*)"[^"]*"/\1"${{ inputs.version }}"/' \
            app/src/main/java/com/minhmc2077/aniclijava/Version.java

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Prepare APKs
        run: |
          mkdir -p dist
          version="${{ inputs.version }}"
          for abi in armeabi-v7a arm64-v8a x86 x86_64 universal; do
            src="app/build/outputs/apk/release/app-${abi}-release.apk"
            if [ -f "$src" ]; then
              cp "$src" "dist/anicli-java-${version}-${abi}.apk"
            fi
          done
          if ! ls dist/*.apk >/dev/null 2>&1; then
            apk=$(find app/build/outputs/apk/release -name '*.apk' -print -quit)
            test -n "$apk"
            cp "$apk" "dist/anicli-java-${version}-universal.apk"
          fi

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: anicli-java-${{ inputs.version }}-universal
          path: dist/anicli-java-${{ inputs.version }}-universal.apk
          if-no-files-found: error

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: anicli-java-${{ inputs.version }}-armeabi-v7a
          path: dist/anicli-java-${{ inputs.version }}-armeabi-v7a.apk
          if-no-files-found: error

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: anicli-java-${{ inputs.version }}-arm64-v8a
          path: dist/anicli-java-${{ inputs.version }}-arm64-v8a.apk
          if-no-files-found: error

      - name: Upload x86 APK
        uses: actions/upload-artifact@v4
        with:
          name: anicli-java-${{ inputs.version }}-x86
          path: dist/anicli-java-${{ inputs.version }}-x86.apk
          if-no-files-found: error

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: anicli-java-${{ inputs.version }}-x86_64
          path: dist/anicli-java-${{ inputs.version }}-x86_64.apk
          if-no-files-found: error

      - name: Commit and push branch
        run: |
          branch="bump-version-${{ inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add app/src/main/java/com/minhmc2077/aniclijava/Version.java
          git commit -m "Bump version to ${{ inputs.version }}"
          git push -u origin "$branch"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ inputs.version }}"
          assets=("dist/anicli-java-${version}-universal.apk")
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            assets+=("dist/anicli-java-${version}-${abi}.apk")
          done
          gh release create "$version" "${assets[@]}" \
            --target "$(git rev-parse HEAD)" \
            --title "AniCli Java $version" \
            --generate-notes

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base main \
            --head "bump-version-${{ inputs.version }}" \
            --title "Bump version to ${{ inputs.version }}" \
            --body "Updates Version.java to ${{ inputs.version }} after the release build."
