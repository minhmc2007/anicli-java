name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APKs
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Show signing key
        run: ./gradlew :app:signingReport --no-daemon

      - name: Prepare debug APKs
        run: |
          mkdir -p dist/debug
          for abi in armeabi-v7a arm64-v8a x86 x86_64 universal; do
            src="app/build/outputs/apk/debug/app-${abi}-debug.apk"
            test -f "$src"
            cp "$src" "dist/debug/anicli-java-debug-${abi}.apk"
          done

      - name: Upload universal debug APK
        uses: actions/upload-artifact@v7
        with:
          name: anicli-java-debug-universal
          path: dist/debug/anicli-java-debug-universal.apk
          if-no-files-found: error

      - name: Upload armeabi-v7a debug APK
        uses: actions/upload-artifact@v7
        with:
          name: anicli-java-debug-armeabi-v7a
          path: dist/debug/anicli-java-debug-armeabi-v7a.apk
          if-no-files-found: error

      - name: Upload arm64-v8a debug APK
        uses: actions/upload-artifact@v7
        with:
          name: anicli-java-debug-arm64-v8a
          path: dist/debug/anicli-java-debug-arm64-v8a.apk
          if-no-files-found: error

      - name: Upload x86 debug APK
        uses: actions/upload-artifact@v7
        with:
          name: anicli-java-debug-x86
          path: dist/debug/anicli-java-debug-x86.apk
          if-no-files-found: error

      - name: Upload x86_64 debug APK
        uses: actions/upload-artifact@v7
        with:
          name: anicli-java-debug-x86_64
          path: dist/debug/anicli-java-debug-x86_64.apk
          if-no-files-found: error
