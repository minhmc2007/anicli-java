name: Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, for example 0.0.1. Must match Version.java.'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version
        run: |
          version="${{ inputs.version }}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $version"
            exit 1
          fi
          source_version=$(grep -oP 'NAME\s*=\s*"\K[^"]+' app/src/main/java/com/minhmc2077/aniclijava/Version.java)
          if [ "$version" != "$source_version" ]; then
            echo "Version mismatch: input is $version, Version.java is $source_version"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p dist
          apk=$(find app/build/outputs/apk/release -name '*-universal-release.apk' -print -quit)
          if [ -z "$apk" ]; then
            apk=$(find app/build/outputs/apk/release -name '*.apk' -print -quit)
          fi
          test -n "$apk"
          cp "$apk" "dist/anicli-java-${{ inputs.version }}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: anicli-java-${{ inputs.version }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.version }}" \
            "dist/anicli-java-${{ inputs.version }}.apk" \
            --target "$GITHUB_SHA" \
            --title "AniCli Java ${{ inputs.version }}" \
            --generate-notes
