plugins {
    id 'com.android.application'
}

def versionFromSource = { ->
    def source = file('src/main/java/com/minhmc2077/aniclijava/Version.java')
    def matcher = source.text =~ /NAME\s*=\s*"([^"]+)"/
    if (!matcher.find()) {
        throw new GradleException('Version.java does not define NAME')
    }
    matcher.group(1)
}

def syncCredential = { property, environment ->
    def value = System.getenv(environment)
    if (!value) {
        def local = new Properties()
        def file = rootProject.file('local.properties')
        if (file.exists()) {
            file.withInputStream { local.load(it) }
        }
        value = local.getProperty(property, '')
    }
    value == null ? '' : value.trim()
}

def configString = { value ->
    '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'
}

def githubToken = (System.getenv('GITHUB_TOKEN') ?: '').trim()

def downloadFile = { String url, File target, boolean json ->
    target.parentFile.mkdirs()
    def connection = new URL(url).openConnection()
    connection.setRequestProperty('User-Agent', 'anicli-java-build')
    connection.setRequestProperty('Accept', json
            ? 'application/vnd.github+json'
            : 'application/octet-stream')
    // Only the API needs the token; release assets reject foreign auth headers.
    if (json && githubToken) {
        connection.setRequestProperty('Authorization', "Bearer ${githubToken}")
    }
    connection.connectTimeout = 30000
    connection.readTimeout = 600000
    connection.inputStream.withStream { input ->
        target.withOutputStream { output -> output << input }
    }
}

def latestNcnnTag = { ->
    def connection = new URL('https://api.github.com/repos/Tencent/ncnn/releases/latest')
            .openConnection()
    connection.setRequestProperty('User-Agent', 'anicli-java-build')
    connection.setRequestProperty('Accept', 'application/vnd.github+json')
    if (githubToken) {
        connection.setRequestProperty('Authorization', "Bearer ${githubToken}")
    }
    connection.connectTimeout = 30000
    connection.readTimeout = 60000
    def release
    connection.inputStream.withStream { input ->
        release = new groovy.json.JsonSlurper().parse(input)
    }
    def tag = release.tag_name
    if (!tag) {
        throw new GradleException('Could not resolve the latest ncnn release')
    }
    return tag
}

def ncnnRoot = layout.buildDirectory.dir('ncnn/current').get().asFile
def rifeAssets = layout.buildDirectory.dir('generated/rife-assets').get().asFile
def rifeCommit = 'a7532fc3f9f8f008cd6eecd6f2ffe2a9698e0cf7'

tasks.register('prepareNcnn') {
    outputs.upToDateWhen { false }
    doLast {
        def tag = latestNcnnTag()
        def marker = new File(ncnnRoot, '.version')
        if (marker.isFile() && marker.text.trim() == tag
                && new File(ncnnRoot, 'arm64-v8a/lib/libncnn.a').isFile()) {
            return
        }
        delete ncnnRoot
        def cacheDir = new File(layout.buildDirectory.get().asFile, 'ncnn')
        def archive = new File(cacheDir, "ncnn-${tag}-android-vulkan.zip")
        if (!archive.isFile() || archive.length() == 0) {
            downloadFile("https://github.com/Tencent/ncnn/releases/download/${tag}/"
                    + "ncnn-${tag}-android-vulkan.zip", archive, false)
        }
        def staging = new File(cacheDir, "staging-${tag}")
        delete staging
        copy {
            from zipTree(archive)
            into staging
        }
        def root = staging.listFiles()?.find { it.isDirectory() }
        if (root == null) {
            throw new GradleException('Unexpected ncnn archive layout')
        }
        copy {
            from root
            into ncnnRoot
        }
        new File(ncnnRoot, '.version').text = tag
        delete staging
    }
}

tasks.register('prepareRifeModel') {
    outputs.upToDateWhen { false }
    doLast {
        def modelDir = new File(rifeAssets, 'rife-v4.6')
        def models = [
                'flownet.param': 16532L,
                'flownet.bin'  : 10614320L,
        ]
        models.each { name, size ->
            def target = new File(modelDir, name)
            if (target.isFile() && target.length() == size) {
                return
            }
            def temp = new File(modelDir, name + '.tmp')
            downloadFile("https://raw.githubusercontent.com/nihui/rife-ncnn-vulkan/"
                    + "${rifeCommit}/models/rife-v4.6/${name}", temp, false)
            if (temp.length() != size) {
                temp.delete()
                throw new GradleException("Unexpected size for ${name}")
            }
            delete target
            if (!temp.renameTo(target)) {
                temp.delete()
                throw new GradleException("Could not store ${name}")
            }
        }
    }
}

tasks.configureEach { task ->
    if (task.name.startsWith('configureCMake') || task.name.startsWith('buildCMake')) {
        task.dependsOn('prepareNcnn')
    }
    if (task.name.startsWith('merge') && task.name.contains('Assets')) {
        task.dependsOn('prepareRifeModel')
    }
}

android {
    namespace 'com.minhmc2077.aniclijava'
    compileSdk 37
    ndkVersion '28.2.13676358'

    // Fixed debug key so consecutive CI builds are signed identically.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storeType 'PKCS12'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId "com.minhmc2077.aniclijava"
        minSdk 26
        targetSdk 37
        versionCode 1
        versionName versionFromSource()

        buildConfigField "String", "MAL_CLIENT_ID",
                configString(syncCredential('mal.clientId', 'MAL_CLIENT_ID'))
        buildConfigField "String", "MAL_CLIENT_SECRET",
                configString(syncCredential('mal.clientSecret', 'MAL_CLIENT_SECRET'))
        buildConfigField "String", "ANILIST_CLIENT_ID",
                configString(syncCredential('anilist.clientId', 'ANILIST_CLIENT_ID'))

        vectorDrawables {
            useSupportLibrary true
        }

        externalNativeBuild {
            cmake {
                arguments "-DNCNN_DIR=${ncnnRoot.absolutePath}"
                cppFlags '-std=c++17'
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            versionNameSuffix "-debug"
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            universalApk true
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    sourceSets {
        main {
            assets.srcDir(rifeAssets)
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    androidResources {
        // The app ships English only; drop library translations.
        localeFilters += ['en']
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
            // Cronet's native libraries are already stripped, so keep AGP from
            // trying (and warning) to strip them again.
            keepDebugSymbols += ['**/libcronet*.so']
        }
        resources {
            excludes += [
                    'META-INF/DEPENDENCIES',
                    'META-INF/LICENSE',
                    'META-INF/LICENSE.txt',
                    'META-INF/NOTICE',
                    'META-INF/NOTICE.txt',
                    'META-INF/AL2.0',
                    'META-INF/LGPL2.1'
            ]
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
        disable 'UnsafeOptInUsageError'
    }
}

dependencies {
    implementation 'androidx.core:core:1.19.1'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.fragment:fragment:1.9.1'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'

    // Media3 / ExoPlayer. Networking is provided by Cronet, not OkHttp.
    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.11.1'
    implementation 'androidx.media3:media3-ui:1.11.1'
    implementation('androidx.media3:media3-datasource-cronet:1.11.1') {
        exclude group: 'com.google.android.gms', module: 'play-services-cronet'
        // The standalone Cronet artifact below provides the same API classes.
        exclude group: 'org.chromium.net', module: 'cronet-api'
    }

    // Bundled Cronet (native library included, works without Google Play Services).
    implementation('org.chromium.net:cronet-bundled:500.1.0') {
        transitive = false
    }
    implementation('org.chromium.net:cronet:500.1.0') {
        transitive = false
    }
}
